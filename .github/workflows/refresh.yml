name: refresh and deploy

# Rebuilds everything from the latest published files once a month, commits the
# refreshed reports, and publishes the dashboard to GitHub Pages.
on:
  schedule:
    - cron: "0 6 8 * *"   # 06:00 UTC on the 8th; departments publish towards the end of the month
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .

      - name: Fetch, build and audit the spend files
        run: |
          spendsentinel fetch
          spendsentinel build
          spendsentinel audit

      - name: Match suppliers to the latest Companies House snapshot
        run: |
          mkdir -p data/raw/companies_house
          file=$(curl -sSf https://download.companieshouse.gov.uk/en_output.html \
                 | grep -o 'BasicCompanyDataAsOneFile-[0-9-]*\.zip' | head -1)
          echo "snapshot: $file"
          curl -sSfL -o "data/raw/companies_house/$file" "https://download.companieshouse.gov.uk/$file"
          spendsentinel companies
          rm -f data/raw/companies_house/*.csv data/raw/companies_house/*.zip
          spendsentinel match

      - name: Build the Tableau extracts and the dashboard
        run: |
          spendsentinel tableau
          spendsentinel site

      - name: Commit refreshed reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "reports unchanged"
          else
            git commit -m "Refresh reports from the latest published spend data"
            git pull --rebase   # someone may have pushed while the pipeline ran
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
